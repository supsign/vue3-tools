# CI-Geruest fuer supsign-Repos: die eigenen Jobs plus die beiden festen Jobs
# am Ende (ci, dependabot).
# Vorlage: https://github.com/supsign/.github/blob/main/templates/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test und Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # vite 7 und vitest 4 verlangen Node >=20.19 bzw. >=22.12
          node-version: '22'
          cache: npm

      - run: npm ci

      # Vor dem Build, damit ein roter Build die Testergebnisse nicht verdeckt.
      # --run: das Script ist "vitest", ohne Flag waere das der Watch-Modus.
      - name: Tests
        run: npm test -- --run

      # Baut die Bibliothek und die Typdeklarationen (vue-tsc), wie beim Publish.
      - name: Build
        run: npm run build

  # Einziger Required-Status-Check im Branch-Schutz. Er fasst alle Jobs
  # zusammen, damit der Branch-Schutz keine einzelnen Jobnamen kennen muss und
  # ein neuer Job ohne Settings-Aenderung mitzaehlt. In `needs` stehen ALLE
  # Jobs dieser Datei ausser ci und dependabot.
  ci:
    name: ci
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Ein Job ist rot oder abgebrochen
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Alle Jobs gruen."

  # Zentrale Dependabot-Automatik, startet nur bei gruenem ci.
  dependabot:
    needs: ci
    uses: supsign/.github/.github/workflows/dependabot.yml@main
    permissions:
      contents: write
      pull-requests: write
